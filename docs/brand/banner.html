<!-- Source of banner.png. Render at 1280x640 (Chrome screenshot or Playwright). Update the screenshots it uses when the app changes. -->
<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
 background:radial-gradient(900px 600px at 82% 40%,rgba(232,120,52,.28),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(232,120,52,.12),transparent 60%),linear-gradient(135deg,#17110e,#22160f 60%,#1a120d);color:#fff;position:relative}
.left{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:560px}
.logo{width:132px;height:132px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));margin-bottom:34px}
h1{font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1}
p.tag{margin-top:20px;font-size:31px;color:#f3d9c4;line-height:1.3;font-weight:400}
.pills{margin-top:34px;display:flex;gap:12px}
.pill{padding:8px 18px;border-radius:999px;font-size:19px;font-weight:600;border:1.5px solid rgba(255,255,255,.18);color:#f6e6d8;background:rgba(255,255,255,.05)}
.pill.alpha{background:#E8783A;border-color:#E8783A;color:#fff}
.phones{position:absolute;right:40px;top:0;bottom:0;width:600px}
.phone{position:absolute;width:228px;height:494px;border-radius:36px;background:#0b0b0c;padding:9px;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1.5px rgba(255,255,255,.12) inset}
.phone img{width:100%;height:100%;border-radius:28px;object-fit:cover;object-position:top;display:block}
.p1{left:20px;top:110px;transform:rotate(-8deg)}
.p3{right:10px;top:110px;transform:rotate(8deg)}
.p2{left:186px;top:60px;width:244px;height:528px;z-index:2}
</style></head><body>
<div class="left">
 <img class="logo" src="logo.svg">
 <h1>Pocket Tavern</h1>
 <p class="tag">SillyTavern, made for your phone.</p>
 <div class="pills"><span class="pill alpha">Alpha</span><span class="pill">SillyTavern extension</span><span class="pill">Android · Termux</span></div>
</div>
<div class="phones">
 <div class="phone p1"><img src="../screenshots/characters.jpg"></div>
 <div class="phone p3"><img src="../screenshots/themes.jpg"></div>
 <div class="phone p2"><img src="../screenshots/chat.jpg"></div>
</div>
</body></html>
