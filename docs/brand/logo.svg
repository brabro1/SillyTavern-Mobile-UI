<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7A94B"/>
      <stop offset="1" stop-color="#D2552A"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7A2A0C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- A chat bubble tucked into a pocket: your chats, in your pocket. -->
  <g filter="url(#shadow)">
    <rect x="168" y="84" width="176" height="128" rx="44" fill="#FFE2BF"/>
    <circle cx="214" cy="140" r="15" fill="#D2552A"/>
    <circle cx="256" cy="140" r="15" fill="#D2552A"/>
    <circle cx="298" cy="140" r="15" fill="#D2552A"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M120 196 H392 V352 L256 424 L120 352 Z" fill="url(#pocket)" stroke="url(#pocket)" stroke-width="28" stroke-linejoin="round"/>
  </g>
  <path d="M140 236 H372" fill="none" stroke="#E0773A" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 13"/>
  <path d="M140 262 V340 L256 401 L372 340 V262" fill="none" stroke="#E0773A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 13"/>
</svg>
